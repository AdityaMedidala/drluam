name: Smoke test

on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test
        default: https://drluam.vercel.app
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke_test.sh "${{ inputs.url }}"
